mongo_db_bundle:
    data_collection: '%kernel.debug%'
    clients:
        default:
            # For MongoDB Atlas, use the uri parameter
            uri:              '%env(MONGODB_URI)%'
            # Atlas requires SSL/TLS
            ssl:              true
            connectTimeoutMS: 3000

            # For local MongoDB, comment out 'uri' and 'ssl: true' above, and uncomment these:
            # hosts:
            #     - { host: '%env(MONGODB_HOST)%', port: '%env(int:MONGODB_PORT)%' }
            # username:         '%env(MONGODB_USER)%'
            # password:         '%env(MONGODB_PASSWORD)%'
            # replicaSet:       '' # default null (no replica)
            # ssl:              false

    connections:
        default:
            client_name:    default
            database_name:  '%env(MONGODB_DB)%'
